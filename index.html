<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devin Rojas</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --fg: #f0f0f0;
      --muted: #888;
      --accent: #5b8cf7;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 2rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header .logo {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--fg);
      text-decoration: none;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-left: 2rem;
      transition: color 0.2s;
    }

    nav a:hover { color: var(--fg); }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 4rem 3rem;
      max-width: 900px;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
    }

    .hero h1 span {
      color: var(--accent);
    }

    .hero p {
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 520px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .links a {
      display: inline-block;
      padding: 0.65rem 1.4rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .links a:hover { opacity: 0.8; }

    .links .primary {
      background: var(--accent);
      color: #fff;
    }

    .links .secondary {
      border: 1px solid #333;
      color: var(--muted);
    }

    footer {
      padding: 2rem 3rem;
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      header, main, footer { padding-left: 1.5rem; padding-right: 1.5rem; }
      nav a:first-child { margin-left: 0; }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="/">devin rojas</a>
    <nav>
      <a href="mailto:devin@devinrojas.me">contact</a>
    </nav>
  </header>

  <main>
    <div class="hero">
      <h1>Hey, I'm <span>Devin.</span></h1>
      <p>this is pure ai slop but wanted to see if the github page will change. </p>
      <div class="links">
        <a class="primary" href="mailto:hello@devinrojas.me">Get in touch</a>
        <a class="secondary" href="https://github.com/devinrojas" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 Devin Rojas
  </footer>

</body>
</html>
